[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-customerservice-demo"
version = "0.1.0"
description = "Ticket-Routing im Kundenservice mit dem Entscheidungsmodell Jev"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.7.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
route-tickets = "routing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
